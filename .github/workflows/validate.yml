name: Validate

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    name: Tests
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.14"
          cache: pip
      - name: Install test tools and integration requirements
        run: python -m pip install pytest-homeassistant-custom-component pysml>=0.1.8 bitstring==4.4.0 pyserial aiousbwatcher ruff
      - name: Run Ruff
        run: ruff check custom_components tests
      - name: Run tests
        run: python -m pytest -q

  hassfest:
    name: Hassfest
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Validate integration
        uses: home-assistant/actions/hassfest@master

  hacs:
    name: HACS
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Validate repository
        uses: hacs/action@main
        with:
          category: integration
          # The domain is shared with the core integration, so the brands check cannot pass.
          ignore: brands
